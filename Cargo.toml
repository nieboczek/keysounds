[package]
name = "keysounds"
version = "0.3.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["tokio", "svg", "advanced"] }
symphonia = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
rdev = "0.5"
toml = "1"
cpal = "0.18"
rand = "0.10"
ringbuf = "0.5"
dirs = "6"
pastey = "0.2"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
